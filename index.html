
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
    padding: 15px;

    background-image:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
        url("https://image.api.playstation.com/vulcan/ap/rnd/202504/1706/4cc02203db88b29b535c26b8296c89f983eaf48d67462e1d.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-family: Arial, sans-serif;
}

h1 {
    color: white;
    font-size: 26px;
    text-align: center;
    text-shadow: 0 2px 8px black;
}

/* Petit cadre centré */
.form-container {
    width: 420px;
    height: 520px;
    max-width: 95vw;
    max-height: 75vh;

    overflow: hidden;
    border-radius: 15px;
    background: white;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
}

/* Formulaire Fillout */
.form-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

@media (max-width: 600px) {
    .form-container {
        width: 95vw;
        height: 70vh;
    }

    h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<h1>Mon questionnaire</h1>

<div class="form-container">
    <iframe
        src="https://forms.fillout.com/t/ajgPh5QPfXus"
        title="Questionnaire"
        loading="eager">
    </iframe>
</div>

</body>
</html>
