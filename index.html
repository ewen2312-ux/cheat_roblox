
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questionnaire Xeno</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;

    background-image:
        url("https://image.api.playstation.com/vulcan/ap/rnd/202504/1706/4cc02203db88b29b535c26b8296c89f983eaf48d67462e1d.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Panneau principal */
.container {
    width: 100%;
    max-width: 420px;
    height: 95vh;
    max-height: 900px;

    background: #191a1d;
    border: 1px solid #303136;
    border-radius: 22px;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;

    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* Titre */
.header {
    width: 100%;
    padding: 25px 20px 15px;
    text-align: center;
    color: white;
    flex-shrink: 0;
}

.header h1 {
    font-size: 30px;
    font-weight: bold;
    line-height: 1.15;
    margin-bottom: 12px;
}

.header p {
    font-size: 15px;
    color: #e0e0e0;
}

/* Zone du questionnaire */
.form-container {
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #191a1d;
}

.form-container iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: none;
}

/* Mobile */
@media (max-width: 600px) {
    body {
        padding: 5px;
        background-attachment: scroll;
    }

    .container {
        height: 98vh;
        max-height: none;
        border-radius: 18px;
    }

    .header {
        padding: 25px 15px 15px;
    }

    .header h1 {
        font-size: 27px;
    }

    .header p {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Questionnaire pour Xeno</h1>
        <p>Merci de répondre au questionnaire ci-dessous</p>
    </div>

    <div class="form-container">
        <iframe
            src="https://forms.fillout.com/t/7Z3Mt92LMgus"
            title="Questionnaire Fillout"
            loading="eager">
        </iframe>
    </div>

</div>

</body>
</html>
