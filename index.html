
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire Xeno</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;

    background:
        url("https://image.api.playstation.com/vulcan/ap/rnd/202504/1706/4cc02203db88b29b535c26b8296c89f983eaf48d67462e1d.png")
        center / cover fixed no-repeat;
}

/* PAGE PRINCIPALE */

.container {
    width: 100%;
    max-width: 420px;
    height: 95vh;
    height: 95dvh;
    max-height: 900px;

    background: #191a1d;
    border: 1px solid #303136;
    border-radius: 22px;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.header {
    width: 100%;
    padding: 25px 20px 15px;
    text-align: center;
    color: white;
    flex-shrink: 0;
}

.header h1 {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 12px;
}

.header p {
    font-size: 14px;
    color: #e0e0e0;
    margin-top: 8px;
}

/* QUESTIONNAIRE */

.form-container {
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #191a1d;
}

.form-container iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: none;
    background: white;
}

/* BOUTON */

.button-area {
    width: 100%;
    padding: 15px;
    flex-shrink: 0;
    background: #191a1d;
}

#launch {
    width: 100%;
    padding: 16px;

    background: #16a34a;
    color: white;

    border: none;
    border-radius: 10px;

    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#launch:hover {
    background: #15803d;
}

/* TERMINAL MATRIX */

#terminal {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    z-index: 9999;
    background: #000;
    overflow: hidden;
}

#matrix {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#status {
    position: absolute;
    top: 35%;
    left: 0;
    width: 100%;
    padding: 20px;
    text-align: center;

    color: #00ff41;
    font-family: Consolas, monospace;
    font-size: clamp(20px, 5vw, 32px);
    text-shadow: 0 0 12px #00ff41;
    pointer-events: none;
}

#countdown {
    display: block;
    margin-top: 25px;
    font-size: 20px;
    color: #aaffbb;
}

#progress-container {
    width: min(80%, 400px);
    height: 10px;
    margin: 25px auto 0;
    border: 1px solid #00ff41;
    border-radius: 10px;
    overflow: hidden;
}

#progress {
    width: 0%;
    height: 100%;
    background: #00ff41;
    transition: width 0.1s linear;
}

/* ÉCRAN FINAL */

#result {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    z-index: 10000;

    background: #000;
    color: #00ff41;

    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 25px;

    font-family: Consolas, monospace;
}

#result h1 {
    font-size: clamp(28px, 6vw, 48px);
    text-shadow: 0 0 10px #00ff41, 0 0 25px #00ff41;
}

#result p {
    margin-top: 20px;
    font-size: 16px;
    line-height: 1.6;
}

#result button {
    margin-top: 30px;
    width: 100%;
    max-width: 300px;
    padding: 14px;

    border: 1px solid #00ff41;
    border-radius: 8px;

    background: transparent;
    color: #00ff41;

    font-family: Consolas, monospace;
    font-size: 16px;
    cursor: pointer;
}

#result button:hover {
    background: #00ff41;
    color: black;
}

#closeMessage {
    display: none;
    color: #aaa;
    font-size: 14px;
}

@media (max-width: 600px) {
    body {
        padding: 5px;
        background-attachment: scroll;
    }

    .container {
        height: 98vh;
        height: 98dvh;
        max-height: none;
        border-radius: 18px;
    }

    .header {
        padding: 20px 12px 12px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 12px;
    }

    .button-area {
        padding: 12px;
    }

    #launch {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- PAGE PRINCIPALE -->

<div class="container" id="main">

    <div class="header">
        <h1>Questionnaire Xeno</h1>
        <p>Réponds au questionnaire ci-dessous.</p>
    </div>

    <!-- Remplace l'URL ci-dessous par celle
         d'un questionnaire sans identifiants de compte -->

    <div class="form-container">
        <iframe
            src="https://forms.fillout.com/t/7Z3Mt92LMgus"
            title="Questionnaire"
            loading="eager"
            allow="clipboard-write">
        </iframe>
    </div>

    <div class="button-area">
        <button id="launch" type="button">
            Lancer la simulation
        </button>
    </div>

</div>

<!-- ANIMATION MATRIX -->

<div id="terminal">
    <canvas id="matrix"></canvas>

    <div id="status">
        SIMULATION EN COURS...

        <span id="countdown">
            Temps restant : 10 secondes
        </span>

        <div id="progress-container">
            <div id="progress"></div>
        </div>
    </div>
</div>

<!-- ÉCRAN FINAL -->

<div id="result">

    <h1>SIMULATION TERMINÉE</h1>

    <p>
        La démonstration visuelle est terminée.
        <br>
        Tu peux fermer cette page.
    </p>

    <button id="closeButton" type="button">
        FERMER LA PAGE
    </button>

    <p id="closeMessage">
        Ton navigateur ne permet pas de fermer
        automatiquement cet onglet.
        Ferme-le manuellement.
    </p>

</div>

<script>
"use strict";

const main = document.getElementById("main");
const terminal = document.getElementById("terminal");
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const launchButton = document.getElementById("launch");
const countdownText = document.getElementById("countdown");
const progress = document.getElementById("progress");

const result = document.getElementById("result");
const closeButton = document.getElementById("closeButton");
const closeMessage = document.getElementById("closeMessage");

const chars =
    "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコ";

const fontSize = 16;
const duration = 10000;

let width = 0;
let height = 0;
let drops = [];

let animationFrame = null;
let countdownInterval = null;
let startTime = 0;
let running = false;

// Adapter le canvas à l'écran

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const columns = Math.ceil(width / fontSize);

    drops = Array.from(
        { length: columns },
        () => Math.random() * (height / fontSize)
    );
}

// Dessiner l'animation

function draw() {
    if (!running) return;

    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px Consolas, monospace";
    ctx.fillStyle = "#00ff41";
    ctx.shadowColor = "#00ff41";
    ctx.shadowBlur = 8;

    for (let i = 0; i < drops.length; i++) {
        const index = Math.floor(Math.random() * chars.length);
        const char = chars.charAt(index);

        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(char, x, y);

        if (y > height && Math.random() > 0.975) {
            drops[i] = 0;
        } else {
            drops[i] += 0.7 + Math.random() * 1.5;
        }
    }

    ctx.shadowBlur = 0;

    animationFrame = requestAnimationFrame(draw);
}

// Compte à rebours

function updateCountdown() {
    if (!running) return;

    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, duration - elapsed);

    const seconds = Math.ceil(remaining / 1000);

    countdownText.textContent =
        "Temps restant : " + seconds +
        (seconds > 1 ? " secondes" : " seconde");

    progress.style.width =
        Math.min(100, elapsed / duration * 100) + "%";

    if (remaining <= 0) {
        finishSimulation();
    }
}

// Lancer la simulation

function startSimulation() {
    if (running) return;

    running = true;

    main.style.display = "none";
    result.style.display = "none";
    terminal.style.display = "block";

    closeMessage.style.display = "none";
    progress.style.width = "0%";

    resizeCanvas();

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    startTime = Date.now();

    draw();
    updateCountdown();

    countdownInterval = setInterval(
        updateCountdown,
        100
    );
}

// Terminer la simulation

function finishSimulation() {
    if (!running) return;

    running = false;

    if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }

    if (countdownInterval !== null) {
        clearInterval(countdownInterval);
        countdownInterval = null;
    }

    terminal.style.display = "none";
    result.style.display = "flex";
}

// Redimensionnement

window.addEventListener("resize", () => {
    if (running) {
        resizeCanvas();
    }
});

// Bouton de lancement

launchButton.addEventListener(
    "click",
    startSimulation
);

// Bouton fermer

closeButton.addEventListener("click", () => {
    window.close();

    setTimeout(() => {
        closeMessage.style.display = "block";
    }, 300);
});

</script>

</body>
</html>
