
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon questionnaire</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .questionnaire {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        iframe {
            display: block;
            width: 100%;
            height: 750px;
            border: none;
        }

        footer {
            color: white;
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            header h1 {
                font-size: 25px;
            }

            .questionnaire {
                border-radius: 12px;
            }

            iframe {
                height: 800px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Mon questionnaire</h1>
        <p>Merci de prendre quelques minutes pour répondre !</p>
    </header>

    <main class="questionnaire">
        <iframe
            src="https://forms.fillout.com/t/ajgPh5QPfXus"
            title="Questionnaire Fillout"
            allow="camera; microphone; geolocation"
            loading="lazy">
        </iframe>
    </main>

    <footer>
        Merci pour ta participation ❤️
    </footer>

</body>
</html>
