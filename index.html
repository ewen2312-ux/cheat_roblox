
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Questionnaire Xeno</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;

    background-image: url(
        "https://image.api.playstation.com/vulcan/ap/rnd/202504/1706/4cc02203db88b29b535c26b8296c89f983eaf48d67462e1d.png"
    );

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* PANNEAU PRINCIPAL */

.container {
    width: 100%;
    max-width: 420px;
    height: 95vh;
    max-height: 900px;

    background: #191a1d;
    border: 1px solid #303136;
    border-radius: 22px;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;

    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* TITRE */

.header {
    width: 100%;
    padding: 25px 20px 15px;
    text-align: center;
    color: white;
    flex-shrink: 0;
}

.header h1 {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.15;
    margin-bottom: 12px;
}

.header p {
    font-size: 14px;
    color: #e0e0e0;
    margin-top: 8px;
}

/* QUESTIONNAIRE */

.form-container {
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #191a1d;
}

.form-container iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: none;
}

/* BOUTON */

.button-area {
    width: 100%;
    padding: 15px;
    flex-shrink: 0;
    background: #191a1d;
}

#launch {
    width: 100%;
    padding: 16px;

    background: #16a34a;
    color: white;

    border: none;
    border-radius: 10px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
}

#launch:hover {
    background: #15803d;
    transform: scale(1.02);
}

/* TERMINAL PLEIN ÉCRAN */

#terminal {
    display: none;

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    z-index: 9999;

    background: #000;
    overflow: hidden;
}

#matrix {
    position: absolute;
    inset: 0;

    display: block;

    width: 100%;
    height: 100%;
}

/* ÉCRAN FINAL */

#result {
    display: none;

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    z-index: 10000;

    background: #000;
    color: #00ff41;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    text-align: center;
    padding: 20px;

    font-family: Consolas, monospace;
}

#result h1 {
    color: #00ff41;

    font-size: clamp(28px, 6vw, 55px);

    text-shadow:
        0 0 10px #00ff41,
        0 0 25px #00ff41;

    animation: appear 1s ease-out;
}

#result p {
    margin-top: 20px;
    font-size: 16px;
    color: #00ff41;
}

#result button {
    margin-top: 30px;

    padding: 12px 30px;

    border: 1px solid #00ff41;
    border-radius: 8px;

    background: transparent;
    color: #00ff41;

    font-family: Consolas, monospace;
    font-size: 16px;

    cursor: pointer;
}

#result button:hover {
    background: #00ff41;
    color: black;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 5px;
        background-attachment: scroll;
    }

    .container {
        height: 98vh;
        height: 98dvh;
        max-height: none;
        border-radius: 18px;
    }

    .header {
        padding: 20px 12px 12px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 12px;
    }

    .button-area {
        padding: 12px;
    }

    #launch {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- PAGE PRINCIPALE -->

<div class="container" id="main">

    <div class="header">
        <h1>Questionnaire Xeno</h1>
        <p>Réponds au questionnaire ci-dessous.</p>
        <p>Démo visuelle uniquement.</p>
    </div>

    <div class="form-container">
        <iframe
            src="https://forms.fillout.com/t/7Z3Mt92LMgus"
            title="Questionnaire Fillout"
            loading="eager">
        </iframe>
    </div>

    <div class="button-area">
        <button id="launch" onclick="startSimulation()">
            Lancer la simulation
        </button>
    </div>

</div>

<!-- TERMINAL MATRIX PLEIN ÉCRAN -->

<div id="terminal">
    <canvas id="matrix"></canvas>
</div>

<!-- ÉCRAN FINAL -->

<div id="result">

    <h1>SIMULATION TERMINÉE</h1>

    <p>Démo visuelle terminée avec succès.</p>

    <button onclick="location.reload()">
        RETOUR
    </button>

</div>

<script>
let animationFrame;
let matrixTimeout;
let resizeHandler;

function startSimulation() {

    // Cacher toute la page principale
    document.getElementById("main").style.display = "none";

    // Afficher le terminal
    const terminal = document.getElementById("terminal");
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    terminal.style.display = "block";

    const chars =
        "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソ";

    const fontSize = 16;

    let width;
    let height;
    let columns;
    let drops;

    // Adapter le canvas à TOUT l'écran
    function resizeCanvas() {

        const dpr = window.devicePixelRatio || 1;

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(
            dpr, 0,
            0, dpr,
            0, 0
        );

        columns = Math.ceil(width / fontSize);

        drops = Array.from(
            { length: columns },
            () => Math.random() * (height / fontSize)
        );
    }

    resizeHandler = resizeCanvas;

    window.addEventListener("resize", resizeHandler);

    // Animation des caractères verts
    function draw() {

        // Fond noir avec effet de traînée
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, width, height);

        ctx.font = fontSize + "px Consolas, monospace";

        for (let i = 0; i < drops.length; i++) {

            const char = chars[
                Math.floor(Math.random() * chars.length)
            ];

            const x = i * fontSize;
            const y = drops[i] * fontSize;

            // Vert lumineux
            ctx.fillStyle = "#00ff41";
            ctx.shadowColor = "#00ff41";
            ctx.shadowBlur = 8;

            ctx.fillText(char, x, y);

            // Recommencer en haut après le bas de l'écran
            if (
                y > height &&
                Math.random() > 0.975
            ) {
                drops[i] = 0;
            }

            // Vitesse de défilement
            drops[i] += 0.7 + Math.random() * 1.5;
        }

        ctx.shadowBlur = 0;

        animationFrame = requestAnimationFrame(draw);
    }

    // Démarrer l'animation
    draw();

    // Arrêter après 5 secondes
    matrixTimeout = setTimeout(() => {

        cancelAnimationFrame(animationFrame);

        window.removeEventListener(
            "resize",
            resizeHandler
        );

        terminal.style.display = "none";

        document.getElementById("result").style.display = "flex";

    }, 5000);
}
</script>

</body>
</html>
