
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire Xeno</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;

    background:
        url("https://image.api.playstation.com/vulcan/ap/rnd/202504/1706/4cc02203db88b29b535c26b8296c89f983eaf48d67462e1d.png")
        center / cover no-repeat fixed;
}

/* Panneau principal */

.container {
    width: 100%;
    max-width: 420px;
    height: 95vh;
    max-height: 900px;

    background: #191a1d;
    border: 1px solid #303136;
    border-radius: 22px;

    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;

    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.header {
    width: 100%;
    padding: 25px 20px 15px;
    text-align: center;
    color: white;
    flex-shrink: 0;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.header p {
    font-size: 14px;
    color: #ddd;
    margin-top: 8px;
}

/* Questionnaire */

.form-container {
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #191a1d;
}

.form-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* Bouton */

.button-area {
    width: 100%;
    padding: 15px;
    flex-shrink: 0;
    background: #191a1d;
}

#launch {
    width: 100%;
    padding: 16px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

#launch:hover {
    background: #15803d;
    transform: scale(1.02);
}

/* Terminal plein écran */

#terminal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    color: #00ff41;
    font-family: Consolas, monospace;
    overflow: hidden;
}

#logs {
    position: absolute;
    inset: 0;
    padding: 12px;
    font-size: 14px;
    line-height: 1.4;
    overflow: hidden;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    opacity: .9;
}

#result {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: #000;
    color: #00ff41;

    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    font-family: Consolas, monospace;
}

#result h1 {
    font-size: clamp(28px, 6vw, 55px);
    text-shadow: 0 0 20px #00ff41;
    animation: appear 1s ease-out;
}

#result p {
    margin-top: 20px;
    font-size: 16px;
}

#result button {
    margin-top: 30px;
    padding: 12px 25px;
    border: 1px solid #00ff41;
    background: transparent;
    color: #00ff41;
    font-size: 16px;
    cursor: pointer;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 600px) {
    body {
        padding: 5px;
        background-attachment: scroll;
    }

    .container {
        height: 98vh;
        border-radius: 18px;
    }

    .header {
        padding: 20px 12px 12px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 12px;
    }

    #logs {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- PAGE PRINCIPALE -->

<div class="container" id="main">

    <div class="header">
        <h1>Questionnaire Xeno</h1>
        <p>Réponds au questionnaire ci-dessous.</p>
        <p>Démo visuelle uniquement.</p>
    </div>

    <div class="form-container">
        <iframe
            src="https://forms.fillout.com/t/7Z3Mt92LMgus"
            title="Questionnaire"
            loading="eager">
        </iframe>
    </div>

    <div class="button-area">
        <button id="launch" onclick="startSimulation()">
            Lancer la simulation
        </button>
    </div>

</div>

<!-- TERMINAL -->

<div id="terminal">
    <div id="logs"></div>
</div>

<!-- ÉCRAN FINAL -->

<div id="result">
    <h1>SIMULATION TERMINÉE</h1>
    <p>Démo visuelle terminée avec succès.</p>
    <button onclick="location.reload()">RETOUR</button>
</div>

<script>
let simulationInterval;

function startSimulation() {

    // Masquer la page principale
    document.getElementById("main").style.display = "none";

    // Afficher le terminal noir
    const terminal = document.getElementById("terminal");
    const logs = document.getElementById("logs");

    terminal.style.display = "block";
    logs.innerHTML = "";

    const chars =
        "0123456789ABCDEFabcdefXYZ#$%&*@<>/\\[]{}";

    let count = 0;

    // Animation des lignes vertes
    simulationInterval = setInterval(() => {

        let line = "";

        for (let i = 0; i < 120; i++) {
            line += chars[
                Math.floor(Math.random() * chars.length)
            ];
        }

        logs.textContent += line + "\n";

        // Garder seulement les dernières lignes visibles
        const lines = logs.textContent.split("\n");

        if (lines.length > 100) {
            logs.textContent = lines.slice(-100).join("\n");
        }

        count++;

        // Après 5 secondes, afficher le résultat
        if (count >= 100) {
            clearInterval(simulationInterval);

            terminal.style.display = "none";

            document.getElementById("result").style.display =
                "flex";
        }

    }, 50);
}
</script>

</body>
</html>
